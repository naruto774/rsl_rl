myrobot/robot_lab:
  model_name: "policy.pt"
  # 156 = 3(ang_vel) + 3(gravity_vec) + 3(commands) + 21(dof_pos) + 21(dof_vel) + 21*5(actions_history)
  # 仅对 actions term 做时间堆叠（actuator delay robustness），其余 obs 维持 1 帧
  num_observations: 156
  observations: ["ang_vel", "gravity_vec", "commands", "dof_pos", "dof_vel", "actions_history"]
  actions_history_length: 5  # K=5，与训练侧 IsaacLab cfg 保持一致；newest-first 拼接 [a_{t-1},...,a_{t-K}]
  observations_history: []  # 0 is the latest observation
  observations_history_priority: "time"  # "time" or "term" priority
  clip_obs: 100.0
  clip_actions_lower: [-100.0, -100.0, -100.0,
                       -100.0, -100.0, -100.0,
                       -100.0, -100.0, -100.0,
                       -100.0, -100.0, -100.0, 
                       -100.0, -100.0, -100.0,
                       -100.0, -100.0, -100.0, 
                       -100.0, -100.0, -100.0]
  clip_actions_upper: [100.0, 100.0, 100.0,
                       100.0, 100.0, 100.0,
                       100.0, 100.0, 100.0,
                       100.0, 100.0, 100.0, 
                       100.0, 100.0, 100.0,
                       100.0, 100.0, 100.0, 
                       100.0, 100.0, 100.0]
  rl_kp: [7.79, 7.79, 14.1, 7.79, 7.79, 14.1, 7.79, 
          7.79, 7.79, 7.79, 7.79, 7.79, 7.79, 14.1, 
          14.1, 5.54, 5.54, 4.71, 4.71, 10, 10]

  rl_kd: [0.12, 0.12, 1.48, 0.12, 0.12, 1.48, 0.12, 
        0.12, 0.12, 0.12, 0.12, 0.12, 0.12, 1.48, 
        1.48, 0.5, 0.5, 0.12, 0.12, 0.123, 0.123]

  fixed_kp: [7.79, 7.79, 14.1, 7.79, 7.79, 14.1, 7.79, 
             7.79, 7.79, 7.79, 7.79, 7.79, 7.79, 14.1, 
             14.1, 5.54, 5.54, 4.71, 4.71, 10, 10]

  fixed_kd: [0.12, 0.12, 1.48, 0.12, 0.12, 1.48, 0.12, 
        0.12, 0.12, 0.12, 0.12, 0.12, 0.12, 1.48, 
        1.48, 0.5, 0.5, 0.12, 0.12, 0.123, 0.123]
  num_of_dofs: 21
  action_scale: [0.25, 0.25,  #0~1      hip pitch
                 0.25,        #2        waist pitch
                 0.25, 0.25,  #3~4      hip roll
                 0.25,        #5        waist yaw
                 0.25, 0.25,  #6~7      hip yaw
                 0.0,         #8        head                     
                 0.25, 0.25,  #9~10     shoulder pitch
                 0.25, 0.25,  #11~12    knee
                 0.25, 0.25,  #13~14    shoulder roll
                 0.25, 0.25,  #10~16    ankle pitch
                 0.25, 0.25,  #17~18    elbow
                 0.25, 0.25]  #19~7.79    ankle roll

  wheel_indices: []
  ang_vel_scale: 0.25
  dof_pos_scale: 1.0
  dof_vel_scale: 0.05
  commands_scale: [1.0, 1.0, 1.0]
  yaw_hold_enable: true
  yaw_hold_kp: 0.6
  yaw_hold_kd: 0.08
  yaw_hold_max_correction: 0.3
  yaw_hold_cmd_limit: 0.5
  yaw_hold_user_cmd_deadband: 0.05
  yaw_hold_forward_cmd_min: 0.05
  rl_blend_duration: 0.2
  torque_limits: [1.96, 1.96, 2.94, 1.96, 1.96, 2.94, 1.96, 
                  1.96, 1.96, 1.96, 1.96, 1.96, 1.96, 2.94, 
                  2.94, 2.94, 2.94, 1.96, 1.96, 2.94, 2.94]

  default_dof_pos: [-0.3, -0.3,0.0, 0.05, -0.05, 0.0, 0.004, -0.004, 
                    0.0, 0.0, 0.0,
                    0.5, 0.5, 0.0, 0.0, 
                    -0.2, -0.2, 0.0, 0.0, -0.06, 0.06]

  joint_mapping: [0, 6, 13, 1, 7, 12, 2, 8, 20, 14, 17, 3, 9, 15, 18, 4, 10, 16, 19, 5, 11]

  # ====== Sim-to-Real 域随机化（MuJoCo-only，real 配置无此字段即自动禁用） ======
  # 噪声模型：o~ = o + ε，ε ~ U(-a, +a)，a 与 obs 同量纲。
  # 数值与 IsaacLab / unitree_rl_lab 训练配置保持一致：
  noise_ang_vel: 0.1             # rad/s，IMU 陀螺仪白噪声
  noise_dof_pos: 0.01            # rad，关节编码器量化/回差
  noise_dof_vel: 0.05            # rad/s，速度差分放大后的高频噪声
  noise_projected_gravity: 0.01  # 无量纲，IMU 姿态估计误差（投影后加噪）

  # ====== Actuator Action Delay（per-episode 采样） ======
  # τ ~ U(min, max) ms；进入 RL 状态 / R 键复位时重采一次，episode 内固定。
  # 在 200Hz 控制环按时间戳释放，等效 K=round(τ/5ms) ∈ {2,3,4} 控制步。
  # 设为 0 或留空即禁用。
  action_delay_ms_min: 0.0
  action_delay_ms_max: 0.0